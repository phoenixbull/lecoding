# Desktop release pipeline.
#
# Triggered by a git tag matching `v*` or `beta-v*`. Builds the Windows
# and macOS installers on their native runners in parallel, signs each
# with the platform-appropriate certificate, then uploads the signed
# artifacts to a GitHub release. The auto-update feed (electron-updater)
# reads the same release API, so the signed installers are picked up by
# every installed instance on the next launch.
#
# Windows builds natively on `windows-latest` so the Squirrel installer
# (electron-winstaller) can produce its setup and update-feed assets without Mono /
# Wine cross-compilation.
#
# M1.4: every macOS job builds on a runner whose CPU matches the target.
# `macos-latest` is arm64-only, which is exactly why the historical x64 job
# shipped an arm64 binary under an x64 name. arm64 uses `macos-15` and x64 uses
# `macos-15-intel`, and `scripts/ci-desktop-make.mjs` refuses to run when the
# runner, the packaged app, or any extracted archive disagrees.
#
# Secrets required (configure in repo Settings → Secrets → Actions):
#   - CSC_LINK                : base64-encoded .p12 (Windows code-signing cert)
#   - CSC_KEY_PASSWORD        : .p12 passphrase
#   - APPLE_ID                : Apple ID for notarization
#   - APPLE_APP_SPECIFIC_PASSWORD : app-specific password (app-specific, NOT login)
#   - APPLE_TEAM_ID           : Apple Developer Team ID (10-char)
#   - GH_TOKEN                : GitHub token with `contents: write`
name: desktop-release

on:
  push:
    tags:
      - "v*"
      - "beta-v*"
  workflow_dispatch:
    inputs:
      require_signed_artifacts:
        description: "Fail the build when artifacts are unsigned"
        required: false
        default: "false"

permissions:
  contents: write

env:
  # A tag push is a real release and must be signed; a manual dispatch is an
  # experiment and may publish an unsigned pre-release.
  LECODING_REQUIRE_SIGNED_ARTIFACTS: >-
    ${{ github.event_name == 'push' && 'true' ||
        inputs.require_signed_artifacts }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (darwin/arm64)
            os: macos-15
            platform: darwin
            arch: arm64
          - name: macOS (darwin/x64)
            os: macos-15-intel
            platform: darwin
            arch: x64
          - name: Windows (win32/x64)
            os: windows-latest
            platform: win32
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (full repository)
        run: pnpm typecheck

      - name: Test (full repository, including loopback integration)
        run: pnpm test

      - name: Report runner architecture
        # Recorded so a mislabelled artifact can be traced back to the runner
        # that produced it.
        run: |
          node -p "'node=' + process.arch + ' platform=' + process.platform"
          if [ "$(uname)" = "Darwin" ]; then
            sysctl -n sysctl.proc_translated || echo "proc_translated=unavailable"
            uname -m
          fi
        shell: bash

      - name: Build & make installer (${{ matrix.platform }}/${{ matrix.arch }})
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The package version flows through every artifact (the Squirrel
          # `setupExe` name, the macOS `CFBundleVersion`, the
          # electron-updater feed, and the release assets uploaded by the
          # `release` job). Reading it from the trigger tag keeps the
          # package, the update feed, and the file name in lock-step.
          LECODING_RELEASE_VERSION: ${{ github.ref_name }}
          LECODING_REQUIRE_SIGNED_ARTIFACTS: ${{ env.LECODING_REQUIRE_SIGNED_ARTIFACTS }}
        run: |
          node scripts/ci-desktop-make.mjs ${{ matrix.platform }} ${{ matrix.arch }}
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/out/make/**/*
          if-no-files-found: error

  release-gate:
    name: Release gate
    needs: build
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.gate.outputs.signed }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Reject duplicate artifact names
        # GitHub release assets are addressed by file name, so two jobs
        # uploading the same name silently overwrite each other and the
        # release loses an architecture without any error.
        run: |
          set -euo pipefail
          duplicates=$(find artifacts -type f -printf '%f\n' | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "FATAL: duplicate artifact names would overwrite each other:"
            echo "$duplicates"
            exit 1
          fi
          echo "No duplicate artifact names."

      - name: Collect signing evidence
        id: gate
        run: |
          set -euo pipefail
          evidence=$(find artifacts -name 'signing-evidence-*.txt' -type f | sort)
          if [ -z "$evidence" ]; then
            echo "FATAL: no signing evidence was produced by any build job."
            exit 1
          fi
          for file in $evidence; do
            echo "--- $file"
            cat "$file"
          done
          # Every architecture must be signed before a stable release ships.
          # grep -L lists files without a `signed=true` line.
          if echo "$evidence" | tr ' ' '\n' | xargs grep -L '^signed=true$' | grep -q .; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "At least one artifact is unsigned; publishing as a pre-release."
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Every artifact is signed."
          fi

  release:
    name: Publish GitHub release
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts (debug)
        run: find artifacts -type f | sort

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/LeCoding-Setup-*.exe
            artifacts/**/*-full.nupkg
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/RELEASES
          generate_release_notes: true
          # An unsigned build must never reach a stable channel; the gate
          # decides this from real signature evidence rather than from a
          # human remembering to tick a box.
          prerelease: >-
            ${{ needs.release-gate.outputs.signed != 'true' ||
                startsWith(github.ref, 'refs/tags/beta-v') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
